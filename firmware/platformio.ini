; ======================================================================
; MAIN_DEF -- DEFINITIVE ESP32 FIRMWARE
; ======================================================================
;   pio run -t upload      flash
;   pio device monitor     watch the CSV (NOT at the same time as the Pi main:
;                          both fight for the same USB port)
;
; Pinning the platform to the 6.x series is MANDATORY: the code uses
; ledcSetup() / ledcAttachPin(), the LEDC API of the Arduino-ESP32 2.x core.
; The 3.x core removed it in favor of ledcAttach().
; ======================================================================

[env:esp32dev]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; 921600 fails on this board: the stub starts, changes baud rate and then
; "Unable to verify flash chip connection (No serial data received)". The
; esptool also sees the crystal at 15.55 MHz before normalizing it to 26,
; which is a symptom of the same marginal link. At 460800 it flashes
; completely and verifies the hash.
upload_speed = 460800
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -Wall

; The TCA9548A and the AS5600 are handled BY REGISTER with Wire: the AS5600
; library was removed on purpose (the reading is two bytes of register 0x0C,
; and this way we do not depend on which version is installed, which is what
; the field tests already did). Preferences comes with the core.
;
; The BNO085 (GY-BNO08X) DOES need a library: it is not a gyroscope read by
; registers, it is a hub that does the fusion internally and delivers the
; finished heading speaking its own protocol (SH-2 over SHTP). It is the same
; library and version carro_v08 used, with the same sensor.
lib_deps =
    adafruit/Adafruit_VL53L0X @ ^1.2.4    ; with underscore: it is the registry name (Sep 12, a clean 'pio run' failed with the space)
    sparkfun/SparkFun BNO080 Cortex Based IMU @ ^1.1.12

; ---------------------------------------------------------------------
; UPLOAD OVER WiFi, WITHOUT TOUCHING THE CAR.
;
;   pio run -e wifi -t upload
;
; It needs the car powered on and on the network. The ESP always requests the
; same IP (11.11.41.14, set in BLOCK 27 of the firmware), so this never needs
; changing: the Pi is .17 and the laptop .13. Adjust it to your own network.
;
; 🔴 THE FIRST TIME IT HAS TO BE FLASHED BY CABLE. The OTA only exists once
; this firmware is inside; a board with the old firmware does not listen.
;
; The first thing the firmware does when an upload starts is brake and
; disable the motors. Even so: the car on the floor and clear.
;
; If it fails with "No response from device", in order: check that the car
; is on, that 'ping 11.11.41.14' answers, and that no turn is in progress
; (it is blocking and does not handle OTA until it ends, at most 8 s).
[env:wifi]
extends = env:esp32dev
upload_protocol = espota
upload_port = 11.11.41.14
; 🔴 FIXED LISTENING PORT. The upload has TWO steps: the PC invites the ESP's
; port 3232 over UDP telling it which of its ports to call back, and the ESP
; opens the return connection. By default espota makes up a different high
; port each time, and the ESP did not reach it: it stayed at "Waiting for
; device". With a fixed and checked one the return connection always gets in.
; The 45 s timeout (default 10) is because of the network at this site,
; which loses packets in bursts.
upload_flags =
    -P
    33531
    -t
    90
